name: Desktop installers
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['codex/e87-studio']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --universal
            name: macOS-universal
          - os: windows-latest
            target: --win --x64
            name: Windows-x64
          - os: ubuntu-22.04
            target: --linux --x64
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: E87-Studio-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
